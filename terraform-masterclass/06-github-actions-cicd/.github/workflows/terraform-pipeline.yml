name: "Lesson 6: Enterprise CI/CD GitOps Pipeline"

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  terraform_pipeline:
    name: "Automated IaC Verification & Delivery"
    runs-on: ubuntu-latest

    # Deploys a dedicated local stack runner background service inside the GitHub workflow infrastructure
    services:
      localstack:
        image: localstack/localstack:3.8.0
        ports:
          - 4566:4566
          - 4510-4559:4510-4559

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # ==============================================================================
      # CONDITION A: SECURE CODE VALIDATION (FIRES ON CODE REVIEW PULL REQUESTS)
      # ==============================================================================
      - name: "Initialize LocalStack Database Schema"
        if: github.event_name == 'pull_request'
        run: |
          aws dynamodb create-table \
            --table-name terraform-lock-table \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url=http://localhost:4566 \
            --region=us-east-1
        env:
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          AWS_DEFAULT_REGION: us-east-1

      - name: "Terraform Init (Local Testing Universe)"
        if: github.event_name == 'pull_request'
        run: |
          cd terraform-masterclass/05-hybrid-cloud-variables
          terraform init -backend-config=localstack.backend.tfvars

      - name: "Terraform Plan Verification (Mock Simulation Scope)"
        if: github.event_name == 'pull_request'
        run: |
          cd terraform-masterclass/05-hybrid-cloud-variables
          terraform workspace select -or-create dev
          terraform plan -var="is_localstack=true"

      # ==============================================================================
      # CONDITION B: AUTOMATED PRODUCTION DEPLOYMENT (FIRES ONLY ON DIRECT PUSHES TO MAIN)
      # ==============================================================================
      - name: "Configure AWS Production Identity Token"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: "Terraform Init (Live Cloud Core)"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd terraform-masterclass/05-hybrid-cloud-variables
          terraform init -backend-config=aws.backend.tfvars

      - name: "Terraform Apply Execution (Live Cloud Production Rollout)"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd terraform-masterclass/05-hybrid-cloud-variables
          terraform workspace select -or-create prod
          terraform apply -auto-approve -var="is_localstack=false"
